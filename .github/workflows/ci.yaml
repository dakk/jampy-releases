name: Jampy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        jam_version: [ '0.7.0', '0.7.1' ]

    env:
      BIN_ARCH: x86-64
      JAM_VERSION: ${{ matrix.jam_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract jampy-target
        run: unzip -q dist/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}.zip -d jampy-target

      - name: Extract jampy-fuzzer
        run: unzip -q dist/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}.zip -d jampy-fuzzer

      - name: Make binaries executable
        run: |
          chmod +x jampy-target/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}
          chmod +x jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}

      - name: Run jampy-target in background
        run: |
          ./jampy-target/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} &
          echo $! > target.pid
        shell: bash

      - name: Wait a bit for target to start
        run: sleep 5

      - name: Run jampy-fuzzer
        run: cd ./jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/ && ./jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}

      - name: Stop jampy-target
        if: always()
        run: kill $(cat target.pid)