name: Jampy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        jam_version: [ '0.7.0', '0.7.1', '0.7.2' ]

    env:
      BIN_ARCH: x86-64
      JAM_VERSION: ${{ matrix.jam_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Jampy
        uses: ./.github/actions/setup-jampy
        with:
          jam_version: ${{ env.JAM_VERSION }}

      - name: Start jampy-target
        run: |
          cd ./jampy-target/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/
          setsid ./jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} --socket-file ${{ github.workspace }}/jam_target.sock &
          echo $! > ${{ github.workspace }}/target.pid
          sleep 3
          for i in 1 2 3 4 5; do
            [ -S ${{ github.workspace }}/jam_target.sock ] && echo "Socket ready" && exit 0
            sleep 1
          done
          echo "Socket not found" && exit 1

      - name: Run jampy-fuzzer
        run: |
          cd ./jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/
          ./jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} --socket-file ${{ github.workspace }}/jam_target.sock

      - name: Stop jampy-target
        if: always()
        run: |
          kill $(cat target.pid) 2>/dev/null || true
          rm -f ${{ github.workspace }}/jam_target.sock
