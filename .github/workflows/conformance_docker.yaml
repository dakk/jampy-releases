name: Conformance Vectors (Docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-vectors:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # - jam_version: '0.7.0'
          #   flags: ''
          # - jam_version: '0.7.1'
          #   flags: ''
          - jam_version: '0.7.2'
            flags: ''
          - jam_version: '0.7.2'
            flags: '--use-recompiler'

    env:
      JAM_VERSION: ${{ matrix.jam_version }}
      JAM_FUZZ: 1
      JAM_FUZZ_SPEC: tiny
      JAM_FUZZ_SOCK_PATH: /workspace/jam_target.sock
      JAM_FUZZ_DATA_PATH: ''
      JAM_FUZZ_LOG_LEVEL: info

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install git
        run: sudo apt-get install -y git

      - name: Clone jam-conformance
        run: git clone https://github.com/davxy/jam-conformance

      - name: Pull Docker images
        run: |
          docker pull ghcr.io/dakk/jampy-target:${{ env.JAM_VERSION }}
          docker pull ghcr.io/dakk/jampy-fuzzer:${{ env.JAM_VERSION }}

      - name: Start jampy-target
        run: |
          docker run -d --name jampy-target \
            --user $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/workspace \
            -e JAM_FUZZ=${{ env.JAM_FUZZ }} \
            -e JAM_FUZZ_SPEC=${{ env.JAM_FUZZ_SPEC }} \
            -e JAM_FUZZ_SOCK_PATH=${{ env.JAM_FUZZ_SOCK_PATH }} \
            -e JAM_FUZZ_DATA_PATH=${{ env.JAM_FUZZ_DATA_PATH }} \
            -e JAM_FUZZ_LOG_LEVEL=${{ env.JAM_FUZZ_LOG_LEVEL }} \
            ghcr.io/dakk/jampy-target:${{ env.JAM_VERSION }} \
            ${{ matrix.flags }}
          sleep 3
          for i in 1 2 3 4 5; do
            [ -S ${{ github.workspace }}/jam_target.sock ] && echo "Socket ready" && exit 0
            sleep 1
          done
          echo "Socket not found"
          docker logs jampy-target
          exit 1

      - name: Run fuzzer on conformance traces
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            filename=$(basename "$f")
            if [[ "$filename" != *genesis* ]]; then
              echo "Running fuzzer on $f"
              relpath="${f#${{ github.workspace }}/}"
              docker run --rm \
                -v ${{ github.workspace }}:/workspace \
                ghcr.io/dakk/jampy-fuzzer:${{ env.JAM_VERSION }} \
                --sock ${{ env.JAM_FUZZ_SOCK_PATH }} \
                --single-trace /workspace/"$relpath" || {
                  echo "Fuzzer returned non-zero on $f"
                }
            fi
          done < <(find ${{ github.workspace }}/jam-conformance/fuzz-reports/${{ env.JAM_VERSION }}/traces/ -type f -name '*.bin' -print0)

      - name: Stop jampy-target
        if: always()
        run: |
          docker stop jampy-target 2>/dev/null || true
          docker rm jampy-target 2>/dev/null || true
          rm -f ${{ github.workspace }}/jam_target.sock
