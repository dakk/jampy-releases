name: Jampy CI - Test Vectors

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-vectors:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        jam_version: [ '0.7.0', '0.7.1', '0.7.2' ]

    env:
      BIN_ARCH: x86-64
      JAM_VERSION: ${{ matrix.jam_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install unzip git
        run: sudo apt-get update && sudo apt-get install -y unzip git

      - name: Extract jampy-target
        run: unzip -q dist/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}.zip -d jampy-target

      - name: Extract jampy-fuzzer
        run: unzip -q dist/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}.zip -d jampy-fuzzer

      - name: Make binaries executable
        run: |
          chmod +x jampy-target/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}
          chmod +x jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}

      - name: Clone jam-test-vectors
        run: git clone https://github.com/davxy/jam-test-vectors

      - name: Run jampy-target in background
        run: |
          ./jampy-target/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/jampy-target-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} &
          echo $! > target.pid
        shell: bash

      - name: Wait for target startup
        run: sleep 5

      - name: Run fuzzer on traces - fallback
        run: |
          for f in jam-test-vectors/traces/fallback/*.bin; do
            if [[ "$f" != *genesis* ]]; then
              echo "Running fuzzer on $f"
              cd ./jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/ && ./jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} --single-trace "../../$f" && cd ../..
            fi
          done

      - name: Run fuzzer on traces - safrole
        run: |
          for f in jam-test-vectors/traces/safrole/*.bin; do
            if [[ "$f" != *genesis* ]]; then
              echo "Running fuzzer on $f"
              cd ./jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/ && ./jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} --single-trace "../../$f" && cd ../..
            fi
          done


      - name: Run fuzzer on traces - preimages_light
        run: |
          for f in jam-test-vectors/traces/preimages_light/*.bin; do
            if [[ "$f" != *genesis* ]]; then
              echo "Running fuzzer on $f"
              cd ./jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/ && ./jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} --single-trace "../../$f" && cd ../..
            fi
          done


      - name: Run fuzzer on traces - storage_light
        run: |
          for f in jam-test-vectors/traces/storage_light/*.bin; do
            if [[ "$f" != *genesis* ]]; then
              echo "Running fuzzer on $f"
              cd ./jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/ && ./jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} --single-trace "../../$f" && cd ../..
            fi
          done

      - name: Run fuzzer on traces - preimages
        run: |
          for f in jam-test-vectors/traces/preimages/*.bin; do
            if [[ "$f" != *genesis* ]]; then
              echo "Running fuzzer on $f"
              cd ./jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/ && ./jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} --single-trace "../../$f" && cd ../..
            fi
          done


      - name: Run fuzzer on traces - storage
        run: |
          for f in jam-test-vectors/traces/storage/*.bin; do
            if [[ "$f" != *genesis* ]]; then
              echo "Running fuzzer on $f"
              cd ./jampy-fuzzer/jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }}/ && ./jampy-fuzzer-${{ env.JAM_VERSION }}_${{ env.BIN_ARCH }} --single-trace "../../$f" && cd ../..
            fi
          done

      - name: Stop jampy-target
        if: always()
        run: kill $(cat target.pid)