name: Jampy CI - Conformance Vectors

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-vectors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install unzip git
        run: sudo apt-get update && sudo apt-get install -y unzip git

      - name: Extract jampy-target
        run: unzip -q dist/jampy-target-0.7.0_x86-64.zip -d jampy-target

      - name: Extract jampy-fuzzer
        run: unzip -q dist/jampy-fuzzer-0.7.0_x86-64.zip -d jampy-fuzzer

      - name: Make binaries executable
        run: |
          chmod +x jampy-target/jampy-target-0.7.0_x86-64/jampy-target-0.7.0_x86-64
          chmod +x jampy-fuzzer/jampy-fuzzer-0.7.0_x86-64/jampy-fuzzer-0.7.0_x86-64

      - name: Clone jam-conformance
        run: git clone https://github.com/davxy/jam-conformance

      - name: Run jampy-target in background
        run: |
          ./jampy-target/jampy-target-0.7.0_x86-64/jampy-target-0.7.0_x86-64 &
          echo $! > target.pid
        shell: bash

      - name: Wait for target startup
        run: sleep 5

      - name: Run fuzzer on conformance traces
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            filename=$(basename "$f")
            if [[ "$filename" != *genesis* ]]; then
              echo "Running fuzzer on $f"
              ./jampy-fuzzer/jampy-fuzzer-0.7.0_x86-64/jampy-fuzzer-0.7.0_x86-64 --single-trace "$f" || {
                echo "Fuzzer returned non-zero on $f"
              }
            fi
          done < <(find jam-conformance/fuzz-reports/0.7.0/traces/ -type f -name '*.bin' -print0)

      - name: Stop jampy-target
        if: always()
        run: kill $(cat target.pid)